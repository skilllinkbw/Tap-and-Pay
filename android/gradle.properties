# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# NOTE: reduced from -Xmx3072m for this development machine (7.8 GB total RAM,
# frequently < 1 GB free while IDE/browser run). The Kotlin compile daemon is
# disabled (in-process strategy is passed on the command line) to avoid daemon
# spawn failures under memory pressure. Increase back to 3G+ on CI / build servers.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Use AndroidX (required).
android.useAndroidX=true

# Enable Gradle configuration cache for faster repeat builds.
org.gradle.configuration-cache=true

# Enable build cache.
org.gradle.caching=true

# Keep worker count low on memory-constrained machines.
org.gradle.workers.max=2